
<!DOCTYPE html>
<html lang="id">
<head>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#06132f">
  <meta name="description" content="Login ke akun Boy-Android">
  <title>Login | Boy-Android</title>
  <link
    rel="icon"
    type="image/png"
    href="boy-android-logo-transparent.png"
    >

  <style>
    /* ===== RESET & WARNA ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #06132f;
      --bg-light: #0b2048;
      --primary: #1685ff;
      --primary-dark: #0754e9;
      --text: #f4f7ff;
      --muted: #9bb6e5;
      --border: #23477f;
    }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(
          ellipse at 15% 10%,
          #123d87 0%,
          transparent 45%
        ),
        radial-gradient(
          ellipse at 90% 90%,
          #102c69 0%,
          transparent 40%
        ),
        linear-gradient(135deg, #06132f, #081d48 55%, #06132f);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 35px 24px;
      overflow-x: hidden;
    }

    /* ===== LAYOUT UTAMA ===== */
    .container {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 70px;
    }

    /* ===== BAGIAN SELAMAT DATANG ===== */
    .welcome {
      text-align: center;
      padding: 20px 0;
    }

    .illustration {
      width: 230px;
      height: 220px;
      margin: 0 auto 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        #164a9d 0%,
        #0b2455 60%,
        transparent 72%
      );
    }

    .welcome-logo {
      width: 190px;
      height: 190px;
      object-fit: contain;
      filter: drop-shadow(0 10px 22px #0006);
    }

    .laptop {
      width: 175px;
      height: 120px;
      border: 8px solid #2786ff;
      border-radius: 12px;
      background: linear-gradient(145deg, #102d61, #06132f);
      box-shadow: 0 0 30px #1685ff35;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .laptop::before {
      content: "";
      width: 5px;
      height: 5px;
      background: #7ebaff;
      border-radius: 50%;
      position: absolute;
      top: -5px;
    }

    .laptop::after {
      content: "";
      position: absolute;
      bottom: -18px;
      left: -17px;
      width: 193px;
      height: 10px;
      border-radius: 3px 3px 10px 10px;
      background: linear-gradient(
        90deg,
        #1261db,
        #62b3ff,
        #1261db
      );
    }

    .lock {
      width: 43px;
      height: 38px;
      background: linear-gradient(135deg, #66b5ff, #1685ff);
      border-radius: 8px;
      position: relative;
      margin-top: 15px;
    }

    .lock::before {
      content: "";
      position: absolute;
      width: 22px;
      height: 25px;
      border: 6px solid #66b5ff;
      border-bottom: none;
      border-radius: 15px 15px 0 0;
      top: -25px;
      left: 5px;
    }

    .lock::after {
      content: "";
      position: absolute;
      width: 8px;
      height: 8px;
      background: #08204b;
      border-radius: 50%;
      top: 11px;
      left: 17px;
      box-shadow: 0 7px 0 -2px #08204b;
    }

    .plant {
      position: absolute;
      bottom: 4px;
      left: 8px;
      width: 25px;
      height: 30px;
      background: linear-gradient(135deg, #1685ff, #0754e9);
      border-radius: 3px 3px 9px 9px;
    }

    .plant::before {
      content: "";
      position: absolute;
      width: 13px;
      height: 27px;
      background: #1685ff;
      border-radius: 100% 0 100% 0;
      top: -27px;
      left: -3px;
      transform: rotate(-20deg);
      box-shadow: 14px -5px 0 -2px #2786ff;
    }

    .welcome h1 {
      font-size: clamp(32px, 4vw, 44px);
      letter-spacing: -1.5px;
      line-height: 1.2;
      margin-bottom: 18px;
    }

    .welcome h1 span {
      color: var(--primary);
    }

    .welcome p {
      max-width: 400px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.8;
    }

    .schematics-download {
      width: min(100%, 360px);
      min-height: 58px;
      margin: 22px auto 0;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      border: 1px solid #4597f5;
      border-radius: 11px;
      background: #0d2d58;
      color: #fff;
      text-align: left;
      text-decoration: none;
      box-shadow: 0 8px 22px #0003;
      transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
    }

    .schematics-download:hover {
      transform: translateY(-2px);
      background: #123b70;
      box-shadow: 0 11px 26px #0004;
      text-decoration: none;
    }

    .schematics-download:focus-visible {
      outline: 3px solid #8bc6ff;
      outline-offset: 3px;
    }

    .schematics-download-icon {
      flex: none;
      color: #77baff;
      font-size: 24px;
      line-height: 1;
    }

    .schematics-download-copy {
      display: grid;
      line-height: 1.35;
    }

    .schematics-download-copy strong { font-size: 13px; }
    .schematics-download-copy small { color: #b4cae8; font-size: 11px; }
    .login-info-link { margin: 14px 0 0; color: var(--muted); font-size: 12px; text-align: center; }
    .login-info-link a { color: #8fc8ff; font-weight: 700; text-decoration: none; }
    .login-info-link a:hover { text-decoration: underline; }

    /* ===== KARTU LOGIN ===== */
    .login-card {
      width: 100%;
      padding: 40px;
      border-radius: 22px;
      background: rgba(5, 19, 47, 0.88);
      border: 1px solid #234b91;
      box-shadow: 0 25px 70px #00000035;
      backdrop-filter: blur(15px);
    }

    .brand {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
    }

    .brand-icon {
      width: 72px;
      height: 72px;
      display: flex;
      lign-items: center;
      justify-content: center;
      flex: 0 0 72px;
      padding: 0;
      background: transparent;
      border: none;
      overflow: visible;
    }

    .brand-icon img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .brand h2 {
      font-size: 36px;
      line-height: 1.15;
      letter-spacing: -1px;
      font-weight: 750;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 15px;
      margin-bottom: 38px;
    }

    /* ===== INPUT ===== */
    .form-group {
      margin-bottom: 24px;
    }

    .form-group label {
      display: block;
      margin-bottom: 11px;
      font-size: 15px;
      font-weight: 600;
    }

    .input-wrap {
      display: flex;
      align-items: center;
      min-width: 0;
      border: 1px solid #284d89;
      border-radius: 13px;
      background: #0b2048;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-wrap:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px #1685ff20;
    }

    .input-icon {
      padding-left: 16px;
      color: #80b6ff;
      font-size: 20px;
    }

    .input-wrap input {
      width: 100%;
      min-width: 0;
      padding: 17px 13px;
      border: none;
      outline: none;
      color: white;
      background: transparent;
      font: inherit;
      font-size: 14px;
    }

    .input-wrap input::placeholder {
      color: #8ba8d8;
    }

    .toggle-password {
      flex-shrink: 0;
      border: none;
      background: transparent;
      color: #80b6ff;
      padding: 12px 15px;
      font-size: 19px;
      cursor: pointer;
    }

    /* ===== OPSI LOGIN ===== */
    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin: 2px 0 28px;
      font-size: 13px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
    }

    .remember input {
      width: 17px;
      height: 17px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    a {
      color: #48a5ff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /* ===== TOMBOL ===== */
    .login-button {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 13px;
      color: white;
      background: linear-gradient(100deg, #1685ff, #0754e9);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .login-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px #1685ff40;
    }

    .login-button:active {
      transform: translateY(0);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 28px 0;
      color: var(--muted);
      font-size: 13px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: var(--border);
    }

    .register-button {
      display: block;
      width: 100%;
      padding: 16px;
      border: 1px solid var(--primary);
      border-radius: 13px;
      text-align: center;
      font-weight: 700;
      color: #48a5ff;
      background: transparent;
      transition: background 0.2s;
    }

    .register-button:hover {
      background: #1685ff14;
      text-decoration: none;
    }

    .message {
      display: none;
      margin-top: 17px;
      padding: 13px;
      border: 1px solid #34588c;
      border-radius: 10px;
      color: #b9d5ff;
      background: #0b2048;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .message.show {
      display: block;
    }

    .resend-verification {
      display: none;
      margin-top: 10px;
      padding: 10px 13px;
      border: 1px solid var(--primary);
      border-radius: 10px;
      color: #b9d5ff;
      background: #0b2048;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .resend-verification.show { display: inline-flex; }

    .verification-support {
      display: none;
      gap: 9px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .verification-support.show { display: flex; }

    .verification-support a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 12px;
      border: 1px solid #2a5da8;
      border-radius: 9px;
      color: #dfeeff;
      background: #102b55;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }

    .verification-support .whatsapp-link {
      border-color: #27865f;
      background: #0d6244;
    }

    footer {
      margin-top: 25px;
      color: #7895c3;
      font-size: 11px;
      text-align: center;
    }

    /* ===== RESPONSIVE HP & TABLET ===== */
    @media (max-width: 850px) {
      body {
        padding: 30px 18px;
      }

      .container {
        max-width: 470px;
        grid-template-columns: 1fr;
        gap: 25px;
      }

      .welcome {
        padding: 0;
      }

      .illustration {
        width: 150px;
        height: 150px;
        margin-bottom: 22px;
      }

      .welcome-logo {
        width: 138px;
        height: 138px;
      }

      .laptop {
        transform: scale(0.75);
      }

      .plant {
        transform: scale(0.8);
      }

      .welcome h1 {
        font-size: 31px;
        margin-bottom: 10px;
      }

      .welcome p {
        font-size: 14px;
      }

      .login-card {
        padding: 30px 24px;
      }

      .subtitle {
        margin-bottom: 30px;
      }
    }

    @media (max-width: 380px) {
      body {
        padding: 22px 13px;
      }

      .login-card {
        padding: 25px 18px;
      }

      .brand h2 {
        font-size: 25px;
      }

      .options {
        font-size: 12px;
      }

      .input-wrap input {
        padding: 15px 10px;
        font-size: 13px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  
    /* ===== TAMPILAN KHUSUS HP: FOKUS KE KARTU LOGIN ===== */
    @media (max-width: 600px) {
      body {
        min-height: 100svh;
        align-items: center;
        padding: 18px 12px;
      }
      .container {
        width: 100%;
        max-width: 470px;
        grid-template-columns: 1fr;
        gap: 0;
      }
      .welcome {
        display: block;
        margin-bottom: 16px;
        padding: 0;
      }
      .welcome .illustration,
      .welcome h1,
      .welcome p { display: none; }
      .schematics-download { margin-top: 0; }
      .login-card {
        width: 100%;
        padding: 28px 20px;
        border-radius: 22px;
      }
      .brand { gap: 12px; }
      .brand-icon {
        width: 58px;
        height: 58px;
        flex-basis: 58px;
      }
      .brand h2 {
        font-size: clamp(25px, 7vw, 34px);
        letter-spacing: -0.8px;
      }
      .subtitle { margin-bottom: 30px; }
      .form-group { margin-bottom: 21px; }
      .input-wrap input {
        padding: 16px 11px;
        font-size: 14px;
      }
      .options {
        gap: 10px;
        margin-bottom: 24px;
      }
      .login-button { min-height: 58px; }
      .divider { margin: 25px 0; }
      .register-button { padding: 15px 10px; }
    }
    @media (max-width: 360px) {
      .login-card { padding: 24px 16px; }
      .brand { gap: 9px; }
      .brand-icon {
        width: 50px;
        height: 50px;
        flex-basis: 50px;
      }
      .brand h2 { font-size: 25px; }
    }
\n  </style>
</head>

<body>
  <main class="container">

    <!-- BAGIAN KIRI -->
    <section class="welcome">
      <div class="illustration">
        <img class="welcome-logo" src="boy-android-logo-transparent.png" alt="Logo Boy-Android">
      </div>

      <h1>Selamat <span>Datang!</span></h1>
      <p>Silakan login untuk melanjutkan.</p>
      <a
        class="schematics-download"
        href="information.html"
        aria-label="Lihat informasi dan unduh aplikasi Boy-Android SCHEMATICS"
      >
        <span class="schematics-download-icon" aria-hidden="true">⊞</span>
        <span class="schematics-download-copy">
          <strong>Unduh Aplikasi Desktop SCHEMATICS</strong>
          <small>Informasi versi dan unduhan terbaru</small>
        </span>
      </a>
    </section>

    <!-- BAGIAN LOGIN -->
    <section class="login-card">
      <div class="brand">
        <div class="brand-icon">
          <img
            src="boy-android-logo-transparent.png"
            alt="Logo Boy-Android"
          >
        </div>
        <h2>Boy-Android</h2>
      </div>

      <p class="subtitle">Login ke akun Anda</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>

          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">✉</span>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Masukkan email Anda"
              autocomplete="username"
              required
            >
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>

          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">♙</span>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Masukkan password Anda"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="toggle-password"
              id="togglePassword"
              aria-label="Tampilkan password"
              aria-pressed="false"
            >◉</button>
          </div>
        </div>

        <div class="options">
          <label class="remember">
            <input type="checkbox" id="remember">
            <span>Ingat saya</span>
          </label>

          <a href="#" id="forgotLink">Lupa password?</a>
        </div>

        <button type="submit" class="login-button">
          Login &nbsp; →
        </button>

        <div
          class="message"
          id="message"
          role="status"
          aria-live="polite"
        ></div>
        <div class="verification-support" id="verificationSupport" aria-label="Hubungi admin untuk bantuan verifikasi">
          <a class="whatsapp-link" href="https://wa.me/6289514007900?text=Halo%20Admin%20Boy-Android%2C%20saya%20gagal%20memverifikasi%20email%20akun." target="_blank" rel="noopener noreferrer">WhatsApp Admin</a>
          <a href="mailto:dimaswilly626@gmail.com?subject=Bantuan%20Verifikasi%20Email&body=Halo%20Admin%20Boy-Android%2C%20saya%20gagal%20memverifikasi%20email%20akun.">Kirim Email</a>
        </div>
        <button type="button" class="resend-verification" id="resendVerification">
          Kirim ulang email verifikasi
        </button>

        <div class="divider">Belum punya akun?</div>

        <a href="register.html" class="register-button">
          ♙ &nbsp; Daftar sekarang &nbsp; →
        </a>
      </form>

    <p class="login-info-link"><a href="information.html">Info versi dan pembaruan SCHEMATICS →</a></p>

      <footer>
        © <span id="year"></span> Boy-Android
      </footer>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="device-lock.js"></script>
  <script src="account-expiry.js"></script>
  <script>
    const SUPABASE_URL = "https://ynohxhmcyoqkupxbqxhn.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_t0pDUhdqe6RikCmVcYRvjg_vmSahQF7";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    const form = document.getElementById("loginForm");
    const password = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");
    const message = document.getElementById("message");
    const verificationSupport = document.getElementById("verificationSupport");

    // Tahun otomatis
    document.getElementById("year").textContent =
      new Date().getFullYear();

    // Tampilkan atau sembunyikan password
    togglePassword.addEventListener("click", function () {
      const isHidden = password.type === "password";

      password.type = isHidden ? "text" : "password";

      togglePassword.textContent = isHidden ? "◎" : "◉";
      togglePassword.setAttribute(
        "aria-label",
        isHidden ? "Sembunyikan password" : "Tampilkan password"
      );
      togglePassword.setAttribute("aria-pressed", String(isHidden));
    });

    // Pesan status
    const resendVerification = document.getElementById("resendVerification");

    function showMessage(text, canResend = false) {
      message.textContent = text;
      message.classList.add("show");
      resendVerification.classList.toggle("show", canResend);
      verificationSupport.classList.toggle("show", canResend);
    }

    function friendlyError(error) {
      const text = (error?.message || "").toLowerCase();
      if (text.includes("invalid login credentials")) return "Email atau password salah. Periksa kembali lalu coba lagi.";
      if (text.includes("email not confirmed")) return "Email belum terverifikasi. Periksa alamat email, lalu cek Kotak Masuk, Spam, atau Promosi dan buka tautan konfirmasi terbaru. Jika belum menerima email, gunakan tombol kirim ulang di bawah.";
      return error?.message || "Terjadi kesalahan. Coba lagi.";
    }
    function isEmailNotConfirmed(error) {
      return (error?.message || "").toLowerCase().includes("email not confirmed");
    }
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = form.querySelector('button[type="submit"]');
      button.disabled = true; button.textContent = "Memproses...";
      message.classList.remove("show");
      resendVerification.classList.remove("show");
      verificationSupport.classList.remove("show");
      try {
        const { data: signInData, error } = await supabaseClient.auth.signInWithPassword({
          email: document.getElementById("email").value.trim(), password: password.value
        });
        if (error) throw error;
        const { data: access, error: accessError } = await supabaseClient
          .from("user_access")
          .select("status, expires_on")
          .eq("user_id", signInData.user.id)
          .maybeSingle();
        if (accessError || !access) {
          await supabaseClient.auth.signOut({ scope: "local" });
          throw new Error("Status akun belum dapat diverifikasi. Coba lagi atau hubungi admin.");
        }
        if (window.BoyAccountExpiry.isExpired(access)) {
          await supabaseClient.auth.signOut({ scope: "local" });
          throw new Error(`Masa berlaku akun habis pada ${window.BoyAccountExpiry.formatDate(access.expires_on)}. Hubungi admin untuk memperpanjang akses.`);
        }
        const lock = await window.BoyDeviceLock.claim(supabaseClient);
        if (!lock.allowed) {
          if (lock.reason === "occupied") throw new Error("Akun ini sedang digunakan di perangkat lain. Keluar dari perangkat tersebut terlebih dahulu.");
          if (lock.reason === "setup") throw new Error("Fitur pembatasan perangkat belum siap. Silakan hubungi admin.");
          throw new Error("Browser tidak dapat menyimpan identitas perangkat. Periksa pengaturan penyimpanan browser.");
        }
        showMessage("Login berhasil. Membuka halaman akun...");
        window.location.href = "dashboard.html";
      } catch (error) { showMessage(friendlyError(error), isEmailNotConfirmed(error)); }
      finally { button.disabled = false; button.innerHTML = "Login &nbsp; →"; }
    });
    resendVerification.addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      if (!email) {
        showMessage("Masukkan alamat email akun terlebih dahulu, lalu coba kirim ulang.", true);
        document.getElementById("email").focus();
        return;
      }
      resendVerification.disabled = true;
      resendVerification.textContent = "Mengirim…";
      try {
        const { error } = await supabaseClient.auth.resend({
          type: "signup",
          email,
          options: { emailRedirectTo: "https://boy-android.github.io/" }
        });
        if (error) throw error;
        showMessage("Permintaan kirim ulang berhasil. Periksa Kotak Masuk, Spam, atau Promosi. Gunakan tautan konfirmasi terbaru.");
      } catch (error) {
        showMessage("Email verifikasi belum dapat dikirim ulang. Pastikan alamatnya benar, tunggu sebentar jika terlalu sering meminta email, lalu coba lagi. " + friendlyError(error), true);
      } finally {
        resendVerification.disabled = false;
        resendVerification.textContent = "Kirim ulang email verifikasi";
      }
    });
    document.getElementById("forgotLink").addEventListener("click", async (event) => {
      event.preventDefault();
      const email = document.getElementById("email").value.trim();
      if (!email) { showMessage("Masukkan email terlebih dahulu, lalu klik Lupa password?"); document.getElementById("email").focus(); return; }
      try {
        const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
          redirectTo: "https://boy-android.github.io/reset-password.html"
        });
        if (error) throw error;
        showMessage("Jika email terdaftar, tautan reset password akan dikirim. Periksa kotak masuk dan folder spam.");
      } catch (error) { showMessage(friendlyError(error)); }
    });
  </script>
  <script src="/pwa.js"></script>
</body>
</html>
