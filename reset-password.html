<body><main class="card"><h1>Buat Password Baru</h1><p>Masukkan password baru untuk akun Boy-Android Anda.</p><form id="resetForm"><label for="password">Password baru</label><input id="password" type="password" minlength="8" autocomplete="new-password" required><label for="confirmPassword">Ulangi password baru</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required><button type="submit">Simpan Password</button></form><div id="message" class="message" role="status" aria-live="polite"></div><a href="index.html">Kembali ke login</a></main>

const supabaseClient=window.supabase.createClient("https://ynohxhmcyoqkupxbqxhn.supabase.co","sb_publishable_t0pDUhdqe6RikCmVcYRvjg_vmSahQF7"),form=document.getElementById("resetForm"),message=document.getElementById("message");
