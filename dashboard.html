<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#06132f"><title>Akun Saya | Boy-Android</title><link rel="icon" type="image/png" href="boy-android-logo-transparent.png">
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:"Segoe UI",Arial,sans-serif;color:#f4f7ff;background:radial-gradient(ellipse at 15% 10%,#123d87,transparent 45%),linear-gradient(135deg,#06132f,#081d48 55%,#06132f)}.card{width:100%;max-width:560px;padding:36px;border-radius:22px;background:rgba(5,19,47,.92);border:1px solid #234b91;box-shadow:0 25px 70px #0005;text-align:center}img{width:68px;height:68px;object-fit:contain}h1{margin:12px 0;font-size:30px}p{color:#9bb6e5;line-height:1.7;overflow-wrap:anywhere}.email{color:#fff;font-weight:600}button,a{display:inline-block;margin-top:12px;padding:13px 18px;border-radius:12px;font-weight:700;text-decoration:none;cursor:pointer}button{border:0;color:white;background:linear-gradient(100deg,#1685ff,#0754e9)}a{color:#48a5ff;border:1px solid #1685ff}</style></head>
<body><main class="card"><img src="boy-android-logo-transparent.png" alt="Logo Boy-Android"><h1>Selamat datang!</h1><p id="status">Memeriksa sesi dan persetujuan akun...</p><p class="email" id="userEmail"></p><button id="logoutButton" hidden>Keluar</button><p><a href="beranda.html">Tutup</a></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const supabaseClient=window.supabase.createClient("https://ynohxhmcyoqkupxbqxhn.supabase.co","sb_publishable_t0pDUhdqe6RikCmVcYRvjg_vmSahQF7");
const statusEl=document.getElementById("status"), emailEl=document.getElementById("userEmail"), logoutButton=document.getElementById("logoutButton");
async function checkSession(){
  const {data,error}=await supabaseClient.auth.getSession();
  if(error||!data.session){window.location.replace("index.html");return;}
  const user=data.session.user;
  emailEl.textContent=user.email||"";
  logoutButton.hidden=false;
  // Fail closed: if the approval record is missing or cannot be read, do not grant access.
  const {data:approval,error:approvalError}=await supabaseClient
    .from("user_access").select("status").eq("user_id",user.id).maybeSingle();
  if(approvalError||!approval){
    statusEl.textContent="Akses belum dapat diverifikasi. Hubungi admin atau coba lagi nanti.";
    return;
  }
  if(approval.status==="approved"){
    statusEl.textContent="Akun Anda telah disetujui. Selamat datang di Boy-Android!";
  }else if(approval.status==="rejected"){
    statusEl.textContent="Maaf, permintaan akun Anda ditolak. Hubungi admin jika merasa ini kekeliruan.";
  }else{
    statusEl.textContent="Akun Anda menunggu persetujuan admin. Anda belum dapat mengakses fitur privat. Silakan kembali lagi nanti.";
  }
}
logoutButton.addEventListener("click",async()=>{logoutButton.disabled=true;const {error}=await supabaseClient.auth.signOut();if(error){statusEl.textContent="Gagal keluar: "+error.message;logoutButton.disabled=false;return;}window.location.replace("index.html");});
checkSession();
</script></body></html>
