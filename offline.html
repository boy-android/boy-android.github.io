<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/theme-mode.js"></script>
  <meta name="theme-color" content="#06132f">
  <title>Offline | Boy-Android</title>
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#06132f,#081d48);font:16px/1.6 "Segoe UI",Arial,sans-serif;color:#f4f7ff}.card{width:min(520px,100%);padding:34px;border:1px solid #234b91;border-radius:22px;background:#0b2045;text-align:center}.card img{width:92px;height:92px;object-fit:contain}.card h1{margin:12px 0;font-size:28px}.card p{margin:0;color:#9bb6e5}.card button{margin-top:22px;padding:11px 18px;border:0;border-radius:10px;background:#1685ff;color:white;font:inherit;font-weight:700;cursor:pointer}
  </style>

<link rel="stylesheet" href="/theme.css">
</head>
<body>
  <main class="card">
    <img src="/icons/icon-192.png" alt="Logo Boy-Android">
    <h1>Anda sedang offline</h1>
    <p>Boy-Android memerlukan koneksi internet untuk login dan memuat data. Sambungkan kembali ke internet, lalu coba lagi.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
  </main>
</body>
</html>
